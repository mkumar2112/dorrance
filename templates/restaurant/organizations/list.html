<!-- SEARCH CARD -->
<div class="card border shadow-sm rounded-3 mb-3">
    <div class="card-body">
        <form id="organizationSearchForm">
            <div class="row g-3">

                <div class="col-md-3">
                    <label class="form-label">Organization Name</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-building"></i>
                        </span>
                        <input
                            type="text"
                            id="searchOrganizationName"
                            class="form-control"
                            placeholder="Search by name"
                        >
                    </div>
                </div>

                <div class="col-md-2">
                    <label class="form-label">City</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-geo-alt"></i>
                        </span>
                        <input
                            type="text"
                            id="searchOrganizationCity"
                            class="form-control"
                            placeholder="City"
                        >
                    </div>
                </div>

                <div class="col-md-2">
                    <label class="form-label">State</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-map"></i>
                        </span>
                        <input
                            type="text"
                            id="searchOrganizationState"
                            class="form-control"
                            placeholder="State"
                        >
                    </div>
                </div>

                <div class="col-md-2">
                    <label class="form-label">Country</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-globe"></i>
                        </span>
                        <input
                            type="text"
                            id="searchOrganizationCountry"
                            class="form-control"
                            placeholder="Country"
                        >
                    </div>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Status</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-toggle-on"></i>
                        </span>

                        <select id="searchOrganizationStatus" class="form-select">
                            <option value="">All</option>
                            <option value="true">Active</option>
                            <option value="false">Inactive</option>
                        </select>

                        <button class="btn btn-primary" type="submit">
                            <i class="bi bi-search"></i>
                        </button>

                        <button
                            class="btn btn-outline-secondary"
                            type="button"
                            id="resetOrganizationSearchBtn"
                        >
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                    </div>
                </div>

            </div>
        </form>
    </div>
</div>


<!-- ORGANIZATION LIST CARD -->
<div class="card border shadow-sm rounded-3">

    <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0">
            <i class="bi bi-building me-2"></i>
            Organizations
        </h5>

        <button
            type="button"
            id="showOrganizationFormBtn"
            class="btn btn-primary btn-sm"
        >
            <i class="bi bi-plus-circle"></i>
            Add Organization
        </button>
    </div>

    <div class="card-body">

        <div class="table-responsive">
            <table class="table table-hover align-middle">

                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Logo</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Location</th>
                        <th>Verified</th>
                        <th>Status</th>
                        <th width="160">Action</th>
                    </tr>
                </thead>

                <tbody id="organizationTableBody">
                    <tr>
                        <td colspan="9" class="text-center text-muted py-4">
                            Loading organizations...
                        </td>
                    </tr>
                </tbody>

            </table>
        </div>

    </div>
</div>


<script>
    window.ORGANIZATION_API_URL = window.ORGANIZATION_API_URL || "/api/organizations/";

    const organizationTableBody = document.getElementById("organizationTableBody");
    const organizationSearchForm = document.getElementById("organizationSearchForm");

    const searchOrganizationName = document.getElementById("searchOrganizationName");
    const searchOrganizationCity = document.getElementById("searchOrganizationCity");
    const searchOrganizationState = document.getElementById("searchOrganizationState");
    const searchOrganizationCountry = document.getElementById("searchOrganizationCountry");
    const searchOrganizationStatus = document.getElementById("searchOrganizationStatus");

    const resetOrganizationSearchBtn = document.getElementById("resetOrganizationSearchBtn");


    function getCSRFToken() {
        const csrfInput = document.querySelector("[name=csrfmiddlewaretoken]");

        if (csrfInput) {
            return csrfInput.value;
        }

        const name = "csrftoken";
        const cookies = document.cookie.split(";");

        for (let cookie of cookies) {
            cookie = cookie.trim();

            if (cookie.startsWith(name + "=")) {
                return decodeURIComponent(cookie.substring(name.length + 1));
            }
        }

        return "";
    }


    function escapeHtml(value) {
        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }


    async function loadOrganizations() {
        organizationTableBody.innerHTML = `
            <tr>
                <td colspan="9" class="text-center text-muted py-4">
                    Loading organizations...
                </td>
            </tr>
        `;

        try {
            const params = new URLSearchParams();

            const name = searchOrganizationName.value.trim();
            const city = searchOrganizationCity.value.trim();
            const state = searchOrganizationState.value.trim();
            const country = searchOrganizationCountry.value.trim();
            const isActive = searchOrganizationStatus.value;

            if (name) {
                params.append("name", name);
            }

            if (city) {
                params.append("city", city);
            }

            if (state) {
                params.append("state", state);
            }

            if (country) {
                params.append("country", country);
            }

            if (isActive !== "") {
                params.append("is_active", isActive);
            }

            const response = await fetch(`${window.ORGANIZATION_API_URL}?${params.toString()}`, {
                method: "GET",
                headers: {
                    "X-Requested-With": "XMLHttpRequest"
                }
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data?.message || data?.detail || "Failed to load organizations");
            }

            const organizations = data.results || data;

            if (!Array.isArray(organizations) || !organizations.length) {
                organizationTableBody.innerHTML = `
                    <tr>
                        <td colspan="9" class="text-center text-muted py-4">
                            No organizations found.
                        </td>
                    </tr>
                `;
                return;
            }

            let html = "";

            organizations.forEach(function(org) {
                const logoHtml = org.logo_url
                    ? `
                        <img
                            src="${escapeHtml(org.logo_url)}"
                            alt="${escapeHtml(org.name)}"
                            class="rounded border"
                            style="width:42px;height:42px;object-fit:cover;"
                        >
                    `
                    : `
                        <div class="bg-light border rounded d-flex align-items-center justify-content-center"
                             style="width:42px;height:42px;">
                            <i class="bi bi-building text-muted"></i>
                        </div>
                    `;

                html += `
                    <tr>
                        <td>${org.id}</td>

                        <td>${logoHtml}</td>

                        <td>
                            <strong>${escapeHtml(org.name)}</strong>
                            <div class="small text-muted">
                                <code>${escapeHtml(org.slug || "")}</code>
                            </div>
                        </td>

                        <td>${escapeHtml(org.email || "-")}</td>

                        <td>${escapeHtml(org.phone || "-")}</td>

                        <td>
                            ${escapeHtml(org.city || "-")}
                            ${org.state ? `, ${escapeHtml(org.state)}` : ""}
                            <div class="small text-muted">
                                ${escapeHtml(org.country || "")}
                            </div>
                        </td>

                        <td>
                            ${
                                org.is_verified
                                ? `<span class="badge bg-info">Verified</span>`
                                : `<span class="badge bg-secondary">Not Verified</span>`
                            }
                        </td>

                        <td>
                            ${
                                org.is_active
                                ? `<span class="badge bg-success">Active</span>`
                                : `<span class="badge bg-danger">Inactive</span>`
                            }
                        </td>

                        <td>
                            <button
                                type="button"
                                class="btn btn-sm btn-primary"
                                onclick="openOrgAdminSection(${org.id}, '${org.name}')"
                                title="Manage Admins"
                            >
                                <i class="bi bi-people"></i>
                            </button>
                            <button
                                type="button"
                                class="btn btn-sm btn-warning"
                                onclick="editOrganization(${org.id})"
                            >
                                <i class="bi bi-pencil"></i>
                            </button>

                            <button
                                type="button"
                                class="btn btn-sm btn-danger"
                                onclick="deleteOrganization(${org.id})"
                            >
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

            organizationTableBody.innerHTML = html;

        } catch (error) {
            organizationTableBody.innerHTML = `
                <tr>
                    <td colspan="9" class="text-center text-danger py-4">
                        ${escapeHtml(error.message || "Failed to load organizations.")}
                    </td>
                </tr>
            `;
        }
    }


    async function deleteOrganization(id) {
        const confirmDelete = confirm("Are you sure you want to delete this organization?");

        if (!confirmDelete) {
            return;
        }

        try {
            const response = await fetch(`${window.ORGANIZATION_API_URL}${id}/`, {
                method: "DELETE",
                headers: {
                    "X-CSRFToken": getCSRFToken(),
                    "X-Requested-With": "XMLHttpRequest"
                }
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data?.message || data?.detail || "Delete failed");
            }

            loadOrganizations();

        } catch (error) {
            alert(error.message || "Failed to delete organization.");
        }
    }


    organizationSearchForm.addEventListener("submit", function(e) {
        e.preventDefault();
        loadOrganizations();
    });


    resetOrganizationSearchBtn.addEventListener("click", function() {
        searchOrganizationName.value = "";
        searchOrganizationCity.value = "";
        searchOrganizationState.value = "";
        searchOrganizationCountry.value = "";
        searchOrganizationStatus.value = "";

        loadOrganizations();
    });


    document.addEventListener("DOMContentLoaded", function() {
        loadOrganizations();
    });
</script>
