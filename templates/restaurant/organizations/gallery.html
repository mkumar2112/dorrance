{% extends 'partials/base.html' %}
{% load static %}

{% block content %}

<div class="container-fluid py-3">

    <div class="card shadow-sm border-0">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <div>
                <h5 class="mb-0">Organization Gallery</h5>
                <small class="text-muted">Manage organization photos</small>
            </div>

            <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#galleryUploadModal">
                <i class="bi bi-plus-circle me-1"></i> Add Photo
            </button>
        </div>

        <div class="card-body">
            <div id="galleryLoader" class="text-center py-5">
                <div class="spinner-border text-primary"></div>
                <p class="text-muted mt-2 mb-0">Loading gallery...</p>
            </div>

            <div id="galleryEmpty" class="text-center py-5 d-none">
                <i class="bi bi-images fs-1 text-muted"></i>
                <h6 class="mt-3 mb-1">No photos found</h6>
                <p class="text-muted mb-0">Click Add Photo to upload gallery images.</p>
            </div>

            <div class="row g-3" id="galleryGrid"></div>
        </div>
    </div>

</div>


<!-- Upload Modal -->
<div class="modal fade" id="galleryUploadModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow">

            <div class="modal-header">
                <h5 class="modal-title">Upload Gallery Photos</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" onclick="resetUploadForm()"></button>
            </div>

            <form id="galleryUploadForm">
                {% csrf_token %}

                <div class="modal-body">

                    <div class="mb-3">
                        <label class="form-label">Select Photos</label>
                        <input
                            type="file"
                            id="galleryImages"
                            class="form-control"
                            accept="image/*"
                            multiple
                        >
                        <small class="text-muted">You can select multiple photos.</small>
                    </div>

                    <div id="selectedPreviewWrapper" class="row g-3"></div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal" onclick="resetUploadForm()">
                        Cancel
                    </button>

                    <button type="submit" class="btn btn-primary" id="uploadBtn">
                        <i class="bi bi-cloud-upload me-1"></i> Upload
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>


<style>
    .gallery-card {
        position: relative;
        overflow: hidden;
        border-radius: 12px;
        border: 1px solid #e5e7eb;
        background: #fff;
    }

    .gallery-img {
        height: 190px;
        width: 100%;
        object-fit: cover;
        display: block;
    }

    .gallery-delete-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        border: none;
        background: rgba(220, 53, 69, 0.95);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .preview-card {
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #e5e7eb;
    }

    .preview-img {
        height: 150px;
        width: 100%;
        object-fit: cover;
    }

    .preview-remove-btn {
        position: absolute;
        top: 7px;
        right: 7px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: none;
        background: rgba(220, 53, 69, 0.95);
        color: #fff;
    }
</style>


<script>
    const GALLERY_API_URL = "/api/organization-gallery/";

    const galleryGrid = document.getElementById("galleryGrid");
    const galleryLoader = document.getElementById("galleryLoader");
    const galleryEmpty = document.getElementById("galleryEmpty");

    const galleryImagesInput = document.getElementById("galleryImages");
    const selectedPreviewWrapper = document.getElementById("selectedPreviewWrapper");
    const galleryUploadForm = document.getElementById("galleryUploadForm");
    const uploadBtn = document.getElementById("uploadBtn");

    let selectedFiles = [];

    function getCSRFToken() {
        const tokenInput = document.querySelector("[name=csrfmiddlewaretoken]");
        return tokenInput ? tokenInput.value : "";
    }

    function loadGallery() {
        galleryLoader.classList.remove("d-none");
        galleryEmpty.classList.add("d-none");
        galleryGrid.innerHTML = "";

        fetch(GALLERY_API_URL, {
            method: "GET",
            headers: {
                "X-Requested-With": "XMLHttpRequest"
            }
        })
        .then(response => response.json())
        .then(result => {
            galleryLoader.classList.add("d-none");

            const data = Array.isArray(result) ? result : (result.results || result.data || []);

            if (!data.length) {
                galleryEmpty.classList.remove("d-none");
                return;
            }

            data.forEach(item => {
                const imageUrl = item.image_url || item.image;

                galleryGrid.innerHTML += `
                    <div class="col-xl-3 col-lg-4 col-md-6 col-sm-6">
                        <div class="gallery-card shadow-sm">
                            <img src="${imageUrl}" class="gallery-img" alt="Gallery Image">

                            <button type="button"
                                class="gallery-delete-btn"
                                onclick="deleteGalleryImage(${item.id})">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
        })
        .catch(error => {
            galleryLoader.classList.add("d-none");
            console.error(error);

            Swal.fire({
                icon: "error",
                title: "Error",
                text: "Failed to load gallery images"
            });
        });
    }

    galleryImagesInput.addEventListener("change", function (event) {
        const files = Array.from(event.target.files);

        files.forEach(file => {
            if (file.type.startsWith("image/")) {
                selectedFiles.push(file);
            }
        });

        renderSelectedPreviews();
        galleryImagesInput.value = "";
    });

    function renderSelectedPreviews() {
        selectedPreviewWrapper.innerHTML = "";

        selectedFiles.forEach((file, index) => {
            const imageUrl = URL.createObjectURL(file);

            selectedPreviewWrapper.innerHTML += `
                <div class="col-lg-3 col-md-4 col-sm-6">
                    <div class="preview-card">
                        <img src="${imageUrl}" class="preview-img" alt="Selected Image">

                        <button type="button"
                            class="preview-remove-btn"
                            onclick="removeSelectedImage(${index})">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>
                </div>
            `;
        });
    }

    function removeSelectedImage(index) {
        selectedFiles.splice(index, 1);
        renderSelectedPreviews();
    }

    function resetUploadForm() {
        selectedFiles = [];
        galleryImagesInput.value = "";
        selectedPreviewWrapper.innerHTML = "";
        uploadBtn.disabled = false;
        uploadBtn.innerHTML = `<i class="bi bi-cloud-upload me-1"></i> Upload`;
    }

    galleryUploadForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        if (!selectedFiles.length) {
            Swal.fire({
                icon: "warning",
                title: "No image selected",
                text: "Please select at least one photo"
            });
            return;
        }

        uploadBtn.disabled = true;
        uploadBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Uploading...`;

        try {
            for (const file of selectedFiles) {
                const formData = new FormData();
                formData.append("image", file);

                const response = await fetch(GALLERY_API_URL, {
                    method: "POST",
                    headers: {
                        "X-CSRFToken": getCSRFToken(),
                        "X-Requested-With": "XMLHttpRequest"
                    },
                    body: formData
                });

                const result = await response.json();

                if (!response.ok || result.success === false) {
                    throw new Error(result.message || "Failed to upload image");
                }
            }

            Swal.fire({
                icon: "success",
                title: "Uploaded",
                text: "Gallery photos uploaded successfully",
                timer: 1200,
                showConfirmButton: false
            });

            const modalElement = document.getElementById("galleryUploadModal");
            const modalInstance = bootstrap.Modal.getInstance(modalElement);
            modalInstance.hide();

            resetUploadForm();
            loadGallery();

        } catch (error) {
            console.error(error);

            Swal.fire({
                icon: "error",
                title: "Upload failed",
                text: error.message || "Something went wrong"
            });

            uploadBtn.disabled = false;
            uploadBtn.innerHTML = `<i class="bi bi-cloud-upload me-1"></i> Upload`;
        }
    });

    function deleteGalleryImage(id) {
        Swal.fire({
            title: "Are you sure?",
            text: "This photo will be deleted and cannot be reverted back.",
            icon: "warning",
            showCancelButton: true,
            confirmButtonColor: "#dc3545",
            cancelButtonColor: "#6c757d",
            confirmButtonText: "Yes, delete it"
        }).then(async (result) => {
            if (!result.isConfirmed) return;

            try {
                const response = await fetch(`${GALLERY_API_URL}${id}/`, {
                    method: "DELETE",
                    headers: {
                        "X-CSRFToken": getCSRFToken(),
                        "X-Requested-With": "XMLHttpRequest"
                    }
                });

                const data = await response.json();

                if (!response.ok || data.success === false) {
                    throw new Error(data.message || "Failed to delete image");
                }

                Swal.fire({
                    icon: "success",
                    title: "Deleted",
                    text: "Gallery image deleted successfully",
                    timer: 1200,
                    showConfirmButton: false
                });

                loadGallery();

            } catch (error) {
                console.error(error);

                Swal.fire({
                    icon: "error",
                    title: "Delete failed",
                    text: error.message || "Something went wrong"
                });
            }
        });
    }

    document.addEventListener("DOMContentLoaded", function () {
        loadGallery();
    });
</script>

{% endblock %}
