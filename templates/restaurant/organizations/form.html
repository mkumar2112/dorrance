<div class="card border shadow-sm rounded-3">

    <div class="card-header bg-white d-flex justify-content-between align-items-center">

        <h5 class="mb-0" id="organizationFormTitle">
            <i class="bi bi-building-add me-2"></i>
            Create Organization
        </h5>

        <button
            type="button"
            id="backToOrganizationListBtn"
            class="btn btn-outline-secondary btn-sm"
        >
            <i class="bi bi-arrow-left"></i>
            Back To List
        </button>

    </div>

    <div class="card-body">

        <form id="organizationForm" enctype="multipart/form-data">
            {% csrf_token %}

            <input type="hidden" id="organizationId">

            <div class="row g-3">

                <!-- ORGANIZATION NAME -->
                <div class="col-md-6">
                    <label class="form-label">
                        Organization Name
                        <span class="text-danger">*</span>
                    </label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-building"></i>
                        </span>

                        <input
                            type="text"
                            id="organizationName"
                            class="form-control"
                            placeholder="Enter organization name"
                            required
                        >
                    </div>
                </div>

                <!-- EMAIL -->
                <div class="col-md-6">
                    <label class="form-label">Email</label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>

                        <input
                            type="email"
                            id="organizationEmail"
                            class="form-control"
                            placeholder="Enter email address"
                        >
                    </div>
                </div>

                <!-- PHONE -->
                <div class="col-md-6">
                    <label class="form-label">Phone</label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-telephone"></i>
                        </span>

                        <input
                            type="text"
                            id="organizationPhone"
                            class="form-control"
                            placeholder="Enter phone number"
                        >
                    </div>
                </div>

                <!-- PINCODE -->
                <div class="col-md-6">
                    <label class="form-label">Pincode</label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-pin-map"></i>
                        </span>

                        <input
                            type="text"
                            id="organizationPincode"
                            class="form-control"
                            placeholder="Enter pincode"
                        >
                    </div>
                </div>

                <!-- CITY -->
                <div class="col-md-4">
                    <label class="form-label">City</label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-geo-alt"></i>
                        </span>

                        <input
                            type="text"
                            id="organizationCity"
                            class="form-control"
                            placeholder="Enter city"
                        >
                    </div>
                </div>

                <!-- STATE -->
                <div class="col-md-4">
                    <label class="form-label">State</label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-map"></i>
                        </span>

                        <input
                            type="text"
                            id="organizationState"
                            class="form-control"
                            placeholder="Enter state"
                        >
                    </div>
                </div>

                <!-- COUNTRY -->
                <div class="col-md-4">
                    <label class="form-label">Country</label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-globe"></i>
                        </span>

                        <input
                            type="text"
                            id="organizationCountry"
                            class="form-control"
                            value="India"
                            placeholder="Enter country"
                        >
                    </div>
                </div>

                <!-- LATITUDE -->
                <div class="col-md-6">
                    <label class="form-label">Latitude</label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-crosshair"></i>
                        </span>

                        <input
                            type="number"
                            step="0.0000001"
                            id="organizationLatitude"
                            class="form-control"
                            placeholder="Enter latitude"
                        >
                    </div>
                </div>

                <!-- LONGITUDE -->
                <div class="col-md-6">
                    <label class="form-label">Longitude</label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-crosshair2"></i>
                        </span>

                        <input
                            type="number"
                            step="0.0000001"
                            id="organizationLongitude"
                            class="form-control"
                            placeholder="Enter longitude"
                        >
                    </div>
                </div>

                <!-- OPENING TIME -->
                <div class="col-md-6">
                    <label class="form-label">Opening Time</label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-clock"></i>
                        </span>

                        <input
                            type="time"
                            id="organizationOpeningTime"
                            class="form-control"
                        >
                    </div>
                </div>

                <!-- CLOSING TIME -->
                <div class="col-md-6">
                    <label class="form-label">Closing Time</label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-clock-history"></i>
                        </span>

                        <input
                            type="time"
                            id="organizationClosingTime"
                            class="form-control"
                        >
                    </div>
                </div>

                <!-- LOGO -->
                <div class="col-md-6">
                    <label class="form-label">Logo</label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-image"></i>
                        </span>

                        <input
                            type="file"
                            id="organizationLogo"
                            class="form-control"
                            accept="image/*"
                        >
                    </div>

                    <div class="mt-2">
                        <img
                            id="organizationLogoPreview"
                            src=""
                            class="img-thumbnail d-none"
                            style="max-height:100px;"
                        >
                    </div>
                </div>

                <!-- VERIFIED -->
                <div class="col-md-3">
                    <label class="form-label">Verified</label>

                    <select id="organizationIsVerified" class="form-select">
                        <option value="false">No</option>
                        <option value="true">Yes</option>
                    </select>
                </div>

                <!-- STATUS -->
                <div class="col-md-3">
                    <label class="form-label">Status</label>

                    <select id="organizationIsActive" class="form-select">
                        <option value="true">Active</option>
                        <option value="false">Inactive</option>
                    </select>
                </div>

                <!-- ADDRESS -->
                <div class="col-md-12">
                    <label class="form-label">Address</label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-geo"></i>
                        </span>

                        <textarea
                            id="organizationAddress"
                            class="form-control"
                            rows="2"
                            placeholder="Enter address"
                        ></textarea>
                    </div>
                </div>

                <!-- DESCRIPTION -->
                <div class="col-md-12">
                    <label class="form-label">Description</label>

                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-text-paragraph"></i>
                        </span>

                        <textarea
                            id="organizationDescription"
                            class="form-control"
                            rows="3"
                            placeholder="Enter description"
                        ></textarea>
                    </div>
                </div>

                <!-- BUTTONS -->
                <div class="col-12 mt-4">

                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="organizationSubmitBtn"
                    >
                        <i class="bi bi-save me-1"></i>
                        Save Organization
                    </button>

                    <button
                        type="button"
                        id="cancelOrganizationFormBtn"
                        class="btn btn-outline-secondary"
                    >
                        Cancel
                    </button>

                </div>

            </div>
        </form>

    </div>

</div>


<script>

    const organizationForm = document.getElementById("organizationForm");

    const organizationId = document.getElementById("organizationId");

    const organizationFormTitle = document.getElementById("organizationFormTitle");

    const organizationSubmitBtn = document.getElementById("organizationSubmitBtn");

    const organizationLogoPreview = document.getElementById("organizationLogoPreview");



    function resetOrganizationForm() {

        organizationForm.reset();

        organizationId.value = "";

        organizationLogoPreview.src = "";
        organizationLogoPreview.classList.add("d-none");

        organizationFormTitle.innerHTML = `
            <i class="bi bi-building-add me-2"></i>
            Create Organization
        `;

        organizationSubmitBtn.innerHTML = `
            <i class="bi bi-save me-1"></i>
            Save Organization
        `;
    }


    function setOrganizationFormData(org) {

        organizationId.value = org.id || "";

        document.getElementById("organizationName").value = org.name || "";
        document.getElementById("organizationEmail").value = org.email || "";
        document.getElementById("organizationPhone").value = org.phone || "";
        document.getElementById("organizationAddress").value = org.address || "";
        document.getElementById("organizationCity").value = org.city || "";
        document.getElementById("organizationState").value = org.state || "";
        document.getElementById("organizationCountry").value = org.country || "";
        document.getElementById("organizationPincode").value = org.pincode || "";

        document.getElementById("organizationLatitude").value = org.latitude || "";
        document.getElementById("organizationLongitude").value = org.longitude || "";

        document.getElementById("organizationOpeningTime").value = org.opening_time || "";
        document.getElementById("organizationClosingTime").value = org.closing_time || "";

        document.getElementById("organizationDescription").value = org.description || "";

        document.getElementById("organizationIsActive").value = org.is_active ? "true" : "false";

        document.getElementById("organizationIsVerified").value = org.is_verified ? "true" : "false";


        if (org.logo_url) {

            organizationLogoPreview.src = org.logo_url;

            organizationLogoPreview.classList.remove("d-none");

        } else {

            organizationLogoPreview.src = "";

            organizationLogoPreview.classList.add("d-none");
        }

        organizationFormTitle.innerHTML = `
            <i class="bi bi-pencil-square me-2"></i>
            Update Organization
        `;

        organizationSubmitBtn.innerHTML = `
            <i class="bi bi-save me-1"></i>
            Update Organization
        `;

        showFormSection();
    }


    async function editOrganization(id) {

        try {

            const response = await fetch(`${ORGANIZATION_API_URL}${id}/`);

            if (!response.ok) {
                throw new Error("Organization not found");
            }

            const org = await response.json();

            setOrganizationFormData(org);

        } catch (error) {
            alert("Failed to load organization.");
        }
    }


    document.getElementById("organizationLogo").addEventListener("change", function(e) {

        const file = e.target.files[0];

        if (!file) {
            return;
        }

        const reader = new FileReader();

        reader.onload = function(event) {

            organizationLogoPreview.src = event.target.result;

            organizationLogoPreview.classList.remove("d-none");
        };

        reader.readAsDataURL(file);
    });


    organizationForm.addEventListener("submit", async function(e) {

        e.preventDefault();

        const id = organizationId.value;

        const formData = new FormData();

        formData.append("name", document.getElementById("organizationName").value.trim());

        formData.append("email", document.getElementById("organizationEmail").value.trim());

        formData.append("phone", document.getElementById("organizationPhone").value.trim());

        formData.append("address", document.getElementById("organizationAddress").value.trim());

        formData.append("city", document.getElementById("organizationCity").value.trim());

        formData.append("state", document.getElementById("organizationState").value.trim());

        formData.append("country", document.getElementById("organizationCountry").value.trim());

        formData.append("pincode", document.getElementById("organizationPincode").value.trim());

        formData.append("latitude", document.getElementById("organizationLatitude").value);

        formData.append("longitude", document.getElementById("organizationLongitude").value);

        formData.append("opening_time", document.getElementById("organizationOpeningTime").value);

        formData.append("closing_time", document.getElementById("organizationClosingTime").value);

        formData.append("description", document.getElementById("organizationDescription").value.trim());

        formData.append(
            "is_active",
            document.getElementById("organizationIsActive").value === "true"
        );

        formData.append(
            "is_verified",
            document.getElementById("organizationIsVerified").value === "true"
        );

        const logoFile = document.getElementById("organizationLogo").files[0];

        if (logoFile) {
            formData.append("logo", logoFile);
        }

        const url = id
            ? `${ORGANIZATION_API_URL}${id}/`
            : ORGANIZATION_API_URL;

        const method = id ? "PUT" : "POST";

        try {

            const response = await fetch(url, {
                method: method,
                headers: {
                    "X-CSRFToken": getCSRFToken()
                },
                body: formData
            });

            const data = await response.json();

            if (!response.ok) {
                console.log(data);
                alert("Failed to save organization.");
                return;
            }

            resetOrganizationForm();

            showListSection();

            loadOrganizations();

        } catch (error) {

            console.log(error);

            alert("Something went wrong.");
        }

    });

</script>
