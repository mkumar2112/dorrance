{% extends 'partials/base.html' %}
{% load static %}

{% block content %}

<div class="container-fluid py-3">

    <div id="listSection">
        {% include 'restaurant/dineInBooking/list.html' %}
    </div>

    <div id="formSection" style="display: none;">
        {% include "restaurant/dineInBooking/form.html" %}
    </div>

</div>

<script>
    const listSection = document.getElementById("listSection");
    const formSection = document.getElementById("formSection");

    const backToListBtn = document.getElementById("backToDineInBookingListBtn");
    const cancelFormBtn = document.getElementById("cancelDineInBookingFormBtn");

    const DINEIN_BOOKING_API_URL = "/api/dinein-bookings/";
    const DINEIN_TABLE_API_URL = "/api/dinein-tables/";

    function showFormSection() {
        listSection.style.display = "none";
        formSection.style.display = "block";
    }

    function showListSection() {
        formSection.style.display = "none";
        listSection.style.display = "block";
    }

    if (backToListBtn) {
        backToListBtn.addEventListener("click", function(e) {
            e.preventDefault();
            showListSection();
        });
    }

    if (cancelFormBtn) {
        cancelFormBtn.addEventListener("click", function(e) {
            e.preventDefault();
            showListSection();
        });
    }
</script>

{% endblock %}
