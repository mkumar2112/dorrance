<div class="card border shadow-sm rounded-3">

    <div class="card-header bg-white d-flex justify-content-between align-items-center">

        <div>
            <h5 class="mb-0">
                <i class="bi bi-grid-3x3-gap me-2"></i>
                Dine In Tables
            </h5>

            <small class="text-muted">
                Manage restaurant dine in tables
            </small>
        </div>

        <button
            type="button"
            class="btn btn-primary"
            id="showDineInBookingFormBtn"
        >
            <i class="bi bi-plus-circle me-1"></i>
            Add Table
        </button>

    </div>

    <div class="card-body">

        <!-- FILTERS -->
        <div class="row g-3 mb-4">

            <!-- SEARCH -->
            <div class="col-md-3">
                <label class="form-label">Search</label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-search"></i>
                    </span>

                    <input
                        type="text"
                        id="dineInTableSearch"
                        class="form-control"
                        placeholder="Search table..."
                    >
                </div>
            </div>


            <!-- FLOOR -->
            <div class="col-md-2">
                <label class="form-label">Floor</label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-layers"></i>
                    </span>

                    <input
                        type="text"
                        id="dineInTableFloorFilter"
                        class="form-control"
                        placeholder="Floor"
                    >
                </div>
            </div>

            <!-- SECTION -->
            <div class="col-md-2">
                <label class="form-label">Section</label>

                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-columns-gap"></i>
                    </span>

                    <input
                        type="text"
                        id="dineInTableSectionFilter"
                        class="form-control"
                        placeholder="Section"
                    >
                </div>
            </div>

            <!-- STATUS -->
            <div class="col-md-1">
                <label class="form-label">Status</label>

                <select id="dineInTableStatusFilter" class="form-select">
                    <option value="">All</option>
                    <option value="true">Active</option>
                    <option value="false">Inactive</option>
                </select>
            </div>

            <!-- RESET -->
            <div class="col-md-1 d-flex align-items-end">
                <button
                    type="button"
                    class="btn btn-secondary w-100"
                    id="resetDineInTableFiltersBtn"
                >
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
            </div>

        </div>

        <!-- TABLE -->
        <div class="table-responsive">

            <table class="table table-bordered table-hover align-middle">

                <thead class="table-light">

                    <tr>
                        <th width="80">S.No.</th>
                        <th>Table</th>
                        <th width="120">Capacity</th>
                        <th width="140">Floor</th>
                        <th width="140">Section</th>
                        <th width="120">Status</th>
                        <th width="130">Actions</th>
                    </tr>

                </thead>

                <tbody id="dineInTableBody">

                    <tr>
                        <td colspan="8" class="text-center text-muted py-4">
                            Loading...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>
    const dineInTableBody = document.getElementById("dineInTableBody");

    const dineInTableSearch = document.getElementById("dineInTableSearch");
    const dineInTableFloorFilter = document.getElementById("dineInTableFloorFilter");
    const dineInTableSectionFilter = document.getElementById("dineInTableSectionFilter");
    const dineInTableStatusFilter = document.getElementById("dineInTableStatusFilter");
    const resetDineInTableFiltersBtn = document.getElementById("resetDineInTableFiltersBtn");

    

    function getTableStatusBadge(status) {
        return status
            ? `<span class="badge bg-success">Active</span>`
            : `<span class="badge bg-danger">Inactive</span>`;
    }

    function getCapacityBadge(capacity) {
        return `
            <span class="badge bg-primary">
                <i class="bi bi-people me-1"></i>
                ${capacity || 0}
            </span>
        `;
    }

    async function loadDineInTables() {
        dineInTableBody.innerHTML = `
            <tr>
                <td colspan="8" class="text-center text-muted py-4">
                    Loading...
                </td>
            </tr>
        `;

        try {
            const params = new URLSearchParams();

            const search = dineInTableSearch.value.trim();
            const floor = dineInTableFloorFilter.value.trim();
            const section = dineInTableSectionFilter.value.trim();
            const status = dineInTableStatusFilter.value;

            if (search) {
                params.append("search", search);
            }

            if (floor) {
                params.append("floor", floor);
            }

            if (section) {
                params.append("section", section);
            }

            if (status) {
                params.append("is_active", status);
            }

            const url = params.toString()
                ? `${DINEIN_TABLE_API_URL}?${params.toString()}`
                : DINEIN_TABLE_API_URL;

            const response = await fetch(url);
            const data = await response.json();

            const tables = Array.isArray(data)
                ? data
                : data.results || data.tables || data.dinein_tables || [];

            if (!response.ok) {
                dineInTableBody.innerHTML = `
                    <tr>
                        <td colspan="8" class="text-center text-danger py-4">
                            ${data.message || "Failed to load tables"}
                        </td>
                    </tr>
                `;
                return;
            }

            if (!tables.length) {
                dineInTableBody.innerHTML = `
                    <tr>
                        <td colspan="8" class="text-center text-muted py-4">
                            No tables found
                        </td>
                    </tr>
                `;
                return;
            }

            dineInTableBody.innerHTML = "";

            tables.forEach((item, index) => {
                dineInTableBody.innerHTML += `
                    <tr>
                        <td>
                            ${index + 1}
                        </td>

                        <td>
                            <div class="fw-semibold">
                                ${item.table_code || "-"}
                            </div>

                            <small class="text-muted">
                                ${item.table_name || ""}
                            </small>
                        </td>

                       
                        <td>
                            ${getCapacityBadge(item.capacity)}
                        </td>

                        <td>
                            ${item.floor || "-"}
                        </td>

                        <td>
                            ${item.section || "-"}
                        </td>

                        <td>
                            ${getTableStatusBadge(item.is_active)}
                        </td>

                        <td>
                            <button
                                type="button"
                                class="btn btn-sm btn-warning"
                                onclick="editDineInTable(${item.id})"
                            >
                                <i class="bi bi-pencil"></i>
                            </button>

                            <button
                                type="button"
                                class="btn btn-sm btn-danger"
                                onclick="deleteDineInTable(${item.id})"
                            >
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

        } catch (error) {
            console.log(error);

            dineInTableBody.innerHTML = `
                <tr>
                    <td colspan="8" class="text-center text-danger py-4">
                        Failed to load tables
                    </td>
                </tr>
            `;
        }
    }

    async function deleteDineInTable(id) {
        const confirmDelete = confirm(
            "Are you sure you want to delete this table?"
        );

        if (!confirmDelete) {
            return;
        }

        try {
            const response = await fetch(
                `${DINEIN_TABLE_API_URL}${id}/`,
                {
                    method: "DELETE",
                    headers: {
                        "X-CSRFToken": getCSRFToken()
                    }
                }
            );

            const data = await response.json();

            if (!response.ok) {
                alert(data.message || "Failed to delete table");
                return;
            }

            loadDineInTables();

        } catch (error) {
            console.log(error);
            alert("Something went wrong.");
        }
    }

    let dineInTableSearchTimeout;
    let dineInTableFloorTimeout;
    let dineInTableSectionTimeout;

    dineInTableSearch.addEventListener("keyup", function() {
        clearTimeout(dineInTableSearchTimeout);

        dineInTableSearchTimeout = setTimeout(() => {
            loadDineInTables();
        }, 400);
    });

    dineInTableFloorFilter.addEventListener("keyup", function() {
        clearTimeout(dineInTableFloorTimeout);

        dineInTableFloorTimeout = setTimeout(() => {
            loadDineInTables();
        }, 400);
    });

    dineInTableSectionFilter.addEventListener("keyup", function() {
        clearTimeout(dineInTableSectionTimeout);

        dineInTableSectionTimeout = setTimeout(() => {
            loadDineInTables();
        }, 400);
    });

  

    dineInTableStatusFilter.addEventListener("change", function() {
        loadDineInTables();
    });

    resetDineInTableFiltersBtn.addEventListener("click", function() {
        dineInTableSearch.value = "";
        dineInTableFloorFilter.value = "";
        dineInTableSectionFilter.value = "";
        dineInTableStatusFilter.value = "";

        loadDineInTables();
    });

    document.addEventListener("DOMContentLoaded", function() {
        loadDineInTables();
    });
</script>
