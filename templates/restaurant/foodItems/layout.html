{% extends 'partials/base.html' %}
{% load static %}

{% block content %}

<div class="container-fluid py-3">

    <!-- LIST SECTION -->
    <div id="listSection">
        {% include 'restaurant/foodItems/list.html' %}
    </div>

    <!-- FORM SECTION -->
    <div id="formSection" style="display: none;">
        {% include "restaurant/foodItems/form.html" %}
    </div>

</div>

<script>

    const listSection = document.getElementById("listSection");
    const formSection = document.getElementById("formSection");

    const showFormBtn = document.getElementById("showFoodItemFormBtn");
    const backToListBtn = document.getElementById("backToFoodItemListBtn");
    const cancelFormBtn = document.getElementById("cancelFoodItemFormBtn");

    const FOOD_ITEM_API_URL = "/api/food-items/";

    function showFormSection() {

        listSection.style.display = "none";

        formSection.style.display = "block";
    }

    function showListSection() {

        formSection.style.display = "none";

        listSection.style.display = "block";
    }

    if (showFormBtn) {

        showFormBtn.addEventListener("click", function(e) {

            e.preventDefault();

            if (typeof resetFoodCategoryForm === "function") {
                resetFoodCategoryForm();
            }

            showFormSection();
        });
    }

    if (backToListBtn) {

        backToListBtn.addEventListener("click", function(e) {

            e.preventDefault();

            showListSection();
        });
    }

    if (cancelFormBtn) {

        cancelFormBtn.addEventListener("click", function(e) {

            e.preventDefault();

            showListSection();
        });
    }

</script>

{% endblock %}
