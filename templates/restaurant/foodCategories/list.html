<div class="card border shadow-sm rounded-3">

    <div class="card-header bg-white d-flex justify-content-between align-items-center">

        <div>
            <h5 class="mb-0">
                <i class="bi bi-grid me-2"></i>
                Food Categories
            </h5>

            <small class="text-muted">
                Manage food categories
            </small>
        </div>

        <button
            type="button"
            class="btn btn-primary"
            id="showFoodCategoryFormBtn"
        >
            <i class="bi bi-plus-circle me-1"></i>
            Add Food Category
        </button>

    </div>

    <div class="card-body">

        <!-- FILTERS -->
        <div class="row g-3 mb-4">

            <!-- SEARCH -->
            <div class="col-md-6">

                <label class="form-label">
                    Search
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-search"></i>
                    </span>

                    <input
                        type="text"
                        id="foodCategorySearch"
                        class="form-control"
                        placeholder="Search category..."
                    >

                </div>

            </div>

            <!-- STATUS -->
            <div class="col-md-6">

                <label class="form-label">
                    Status
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-toggle-on"></i>
                    </span>

                    <select
                        id="foodCategoryStatusFilter"
                        class="form-select"
                    >
                        <option value="">
                            All
                        </option>

                        <option value="true">
                            Active
                        </option>

                        <option value="false">
                            Inactive
                        </option>
                    </select>

                </div>

            </div>

        </div>

        <!-- TABLE -->
        <div class="table-responsive">

            <table class="table table-bordered table-hover align-middle">

                <thead class="table-light">

                    <tr>

                        <th width="80">
                            Image
                        </th>

                        <th>
                            Name
                        </th>

                        <th width="120">
                            Sort Order
                        </th>

                        <th width="120">
                            Status
                        </th>

                        <th width="160">
                            Created
                        </th>

                        <th width="130">
                            Actions
                        </th>

                    </tr>

                </thead>

                <tbody id="foodCategoryTableBody">

                    <tr>
                        <td colspan="6" class="text-center text-muted py-4">
                            Loading...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>
    const foodCategoryTableBody = document.getElementById("foodCategoryTableBody");
    const foodCategorySearch = document.getElementById("foodCategorySearch");
    const foodCategoryStatusFilter = document.getElementById("foodCategoryStatusFilter");

    function getFoodCategoryStatusBadge(isActive) {
        return isActive
            ? `<span class="badge bg-success">Active</span>`
            : `<span class="badge bg-danger">Inactive</span>`;
    }

    function getFoodCategoryImage(imageUrl) {
        if (imageUrl) {
            return `
                <img
                    src="${imageUrl}"
                    class="rounded border"
                    style="width:60px;height:60px;object-fit:cover;"
                >
            `;
        }

        return `
            <div
                class="d-flex align-items-center justify-content-center border rounded bg-light"
                style="width:60px;height:60px;"
            >
                <i class="bi bi-image text-muted"></i>
            </div>
        `;
    }

    function getFoodCategoryCreatedDate(createdAt) {
        if (!createdAt) {
            return "-";
        }

        return new Date(createdAt).toLocaleDateString();
    }

    async function loadFoodCategories() {
        foodCategoryTableBody.innerHTML = `
            <tr>
                <td colspan="6" class="text-center text-muted py-4">
                    Loading...
                </td>
            </tr>
        `;

        try {
            const params = new URLSearchParams();

            const search = foodCategorySearch.value.trim();
            const status = foodCategoryStatusFilter.value;

            if (search) {
                params.append("search", search);
            }

            if (status) {
                params.append("is_active", status);
            }

            const url = params.toString()
                ? `${FOOD_CATEGORY_API_URL}?${params.toString()}`
                : FOOD_CATEGORY_API_URL;

            const response = await fetch(url, {
                method: "GET",
                headers: {
                    "X-CSRFToken": getCSRFToken()
                }
            });

            const data = await response.json();

            const categories = Array.isArray(data)
                ? data
                : data.results || data.food_categories || [];

            if (!response.ok || !data.status) {
                foodCategoryTableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center text-danger py-4">
                            ${data.message || "Failed to load food categories"}
                        </td>
                    </tr>
                `;
                return;
            }

            if (!categories.length) {
                foodCategoryTableBody.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center text-muted py-4">
                            No food categories found
                        </td>
                    </tr>
                `;
                return;
            }

            foodCategoryTableBody.innerHTML = "";

            categories.forEach(category => {
                foodCategoryTableBody.innerHTML += `
                    <tr>
                        <td>
                            ${getFoodCategoryImage(category.image_url)}
                        </td>

                        <td>
                            <div class="fw-semibold">
                                ${category.name || "-"}
                            </div>

                            <small class="text-muted">
                                ${category.slug || ""}
                            </small>
                        </td>

                        <td>
                            ${category.sort_order || 0}
                        </td>

                        <td>
                            ${getFoodCategoryStatusBadge(category.is_active)}
                        </td>

                        <td>
                            ${getFoodCategoryCreatedDate(category.created_at)}
                        </td>

                        <td>
                            <button
                                type="button"
                                class="btn btn-sm btn-warning"
                                onclick="editFoodCategory(${category.id})"
                            >
                                <i class="bi bi-pencil"></i>
                            </button>

                            <button
                                type="button"
                                class="btn btn-sm btn-danger"
                                onclick="deleteFoodCategory(${category.id})"
                            >
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });

        } catch (error) {
            console.log(error);

            foodCategoryTableBody.innerHTML = `
                <tr>
                    <td colspan="6" class="text-center text-danger py-4">
                        Failed to load food categories
                    </td>
                </tr>
            `;
        }
    }

    async function deleteFoodCategory(id) {
        const confirmDelete = confirm(
            "Are you sure you want to delete this food category?"
        );

        if (!confirmDelete) {
            return;
        }

        try {
            const response = await fetch(`${FOOD_CATEGORY_API_URL}${id}/`, {
                method: "DELETE",
                headers: {
                    "X-CSRFToken": getCSRFToken()
                }
            });

            const data = await response.json();

            if (!response.ok || !data.status) {
                alert(data.message || "Failed to delete food category.");
                return;
            }

            loadFoodCategories();

        } catch (error) {
            console.log(error);
            alert("Something went wrong.");
        }
    }

    let foodCategorySearchTimeout;

    foodCategorySearch.addEventListener("keyup", function() {
        clearTimeout(foodCategorySearchTimeout);

        foodCategorySearchTimeout = setTimeout(() => {
            loadFoodCategories();
        }, 400);
    });

    foodCategoryStatusFilter.addEventListener("change", function() {
        loadFoodCategories();
    });

    document.addEventListener("DOMContentLoaded", function() {
        loadFoodCategories();
    });
</script>
