{% extends 'partials/base.html' %}
{% load static %}

{% block content %}

<div class="container-fluid py-3">

    <!-- LIST SECTION -->
    <div id="listSection">
        {% include 'home/roles/list.html' %}
    </div>

    <!-- FORM SECTION -->
    <div id="formSection" style="display: none;">
        {% include "home/roles/form.html" %}
    </div>

</div>

<script>
    const listSection = document.getElementById("listSection");
    const formSection = document.getElementById("formSection");

    const showFormBtn = document.getElementById("showFormBtn");
    const backToListBtn = document.getElementById("backToListBtn");
    const cancelFormBtn = document.getElementById("cancelFormBtn");
    const ROLE_API_URL = "/api/roles/";

    function showFormSection() {
        listSection.style.display = "none";
        formSection.style.display = "block";
    }

    function showListSection() {
        formSection.style.display = "none";
        listSection.style.display = "block";
    }

    if (showFormBtn) {
        showFormBtn.addEventListener("click", function(e) {
            e.preventDefault();
            showFormSection();
        });
    }

    if (backToListBtn) {
        backToListBtn.addEventListener("click", function(e) {
            e.preventDefault();
            showListSection();
        });
    }

    if (cancelFormBtn) {
        cancelFormBtn.addEventListener("click", function(e) {
            e.preventDefault();
            showListSection();
        });
    }
</script>

{% endblock %}
